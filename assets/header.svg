<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#15305a"/>
    </linearGradient>
    <linearGradient id="barg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c9bf0"/>
      <stop offset="1" stop-color="#1f5fb8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <style>
    .f{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:Consolas,'SFMono-Regular','DejaVu Sans Mono',monospace}
    .role{opacity:0;animation:role 9s infinite}
    .r2{animation-delay:3s}.r3{animation-delay:6s}
    @keyframes role{0%{opacity:0}6%{opacity:1}28%{opacity:1}34%{opacity:0}100%{opacity:0}}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2.2s 1.1s ease-out forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .dot{opacity:0;animation:show .4s 3.2s forwards}
    @keyframes show{to{opacity:1}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2s 3.4s infinite}
    @keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <circle cx="1080" cy="-40" r="220" fill="#4cc9f0" opacity="0.06"/>
  <circle cx="120" cy="380" r="200" fill="#2a78d6" opacity="0.08"/>

  <!-- left: identity -->
  <text x="64" y="92" class="m" font-size="17" fill="#4cc9f0" letter-spacing="3">&gt; SELECT * FROM profile<tspan class="cur">_</tspan></text>
  <text x="62" y="152" class="f" font-size="54" font-weight="700" fill="#ffffff">Mir Makarim Ahsan</text>
  <g class="f" font-size="27" font-weight="600" fill="#cfe3ff">
    <text x="64" y="205" class="role">BI &amp; Data Analyst</text>
    <text x="64" y="205" class="role r2">Power BI · Microsoft Fabric · SQL</text>
    <text x="64" y="205" class="role r3">Procurement &amp; Finance Analytics</text>
  </g>
  <rect x="64" y="232" width="72" height="4" rx="2" fill="#f4a261"/>
  <text x="64" y="274" class="f" font-size="17" fill="#8fb0d6">Business Intelligence  ·  Data Engineering  ·  Process Automation  ·  AI Agents</text>
  <text x="64" y="302" class="f" font-size="15" fill="#6f8db3">Soest, Germany</text>

  <!-- right: mini dashboard -->
  <rect x="770" y="48" width="370" height="244" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="792" cy="70" r="5" fill="#e34948"/><circle cx="808" cy="70" r="5" fill="#eda100"/><circle cx="824" cy="70" r="5" fill="#1baf7a"/>
  <text x="842" y="75" class="m" font-size="13" fill="#8fb0d6">insights.pbix</text>
  <line x1="789" x2="1121" y1="265" y2="265" stroke="#ffffff" stroke-opacity="0.18"/>
  <g fill="url(#barg)">
    <rect class="bar" x="789" y="205" width="28" height="60" rx="4" style="animation-delay:.05s"/>
    <rect class="bar" x="831" y="180" width="28" height="85" rx="4" style="animation-delay:.15s"/>
    <rect class="bar" x="873" y="193" width="28" height="72" rx="4" style="animation-delay:.25s"/>
    <rect class="bar" x="915" y="155" width="28" height="110" rx="4" style="animation-delay:.35s"/>
    <rect class="bar" x="957" y="170" width="28" height="95" rx="4" style="animation-delay:.45s"/>
    <rect class="bar" x="999" y="130" width="28" height="135" rx="4" style="animation-delay:.55s"/>
    <rect class="bar" x="1041" y="115" width="28" height="150" rx="4" style="animation-delay:.65s"/>
    <rect class="bar" x="1083" y="95" width="28" height="170" rx="4" style="animation-delay:.75s;fill:#4cc9f0"/>
  </g>
  <polyline class="line" points="803,183 845,158 887,171 929,133 971,148 1013,108 1055,93 1097,73" fill="none" stroke="#f4a261" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="dot">
    <circle class="ring" cx="1097" cy="73" r="6" fill="#f4a261"/>
    <circle cx="1097" cy="73" r="6" fill="#f4a261" stroke="#0a1626" stroke-width="2"/>
  </g>
</svg>
