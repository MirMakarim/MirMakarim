<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1626"/>
      <stop offset="1" stop-color="#15305a"/>
    </linearGradient>
  </defs>
  <style>
    .f{font-family:'Segoe UI',Inter,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:Consolas,'SFMono-Regular','DejaVu Sans Mono',monospace}
    .st{opacity:0;animation:in .6s ease-out forwards}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.2s infinite}
    @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.6);opacity:0}}
  </style>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <text x="40" y="44" class="m" font-size="15" fill="#4cc9f0" letter-spacing="2">career.pipeline  →  extract · transform · load · serve</text>

  <path id="p" d="M150 150 H1050" stroke="#2a78d6" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" fill="none" opacity="0.8"/>
  <g fill="#4cc9f0">
    <circle r="5"><animateMotion dur="4s" repeatCount="indefinite" path="M150 150 H1050"/></circle>
    <circle r="5" opacity=".7"><animateMotion dur="4s" begin="1.3s" repeatCount="indefinite" path="M150 150 H1050"/></circle>
    <circle r="5" opacity=".45"><animateMotion dur="4s" begin="2.6s" repeatCount="indefinite" path="M150 150 H1050"/></circle>
  </g>

  <g class="f" text-anchor="middle">
    <g class="st" style="animation-delay:.1s">
      <text x="150" y="98" font-size="20" font-weight="700" fill="#ffffff">2020</text>
      <circle cx="150" cy="150" r="32" fill="#13294b" stroke="#2a78d6" stroke-width="3"/>
      <text x="150" y="157" class="m" font-size="18" fill="#cfe3ff">01</text>
      <text x="150" y="216" font-size="14" font-weight="700" fill="#4cc9f0" letter-spacing="3">EXTRACT</text>
      <text x="150" y="243" font-size="17" font-weight="600" fill="#ffffff">Treasury &amp; Finance</text>
      <text x="150" y="266" font-size="14" fill="#8fb0d6">Beximco Pharmaceuticals</text>
    </g>
    <g class="st" style="animation-delay:.5s">
      <text x="450" y="98" font-size="20" font-weight="700" fill="#ffffff">2022</text>
      <circle cx="450" cy="150" r="32" fill="#13294b" stroke="#2a78d6" stroke-width="3"/>
      <text x="450" y="157" class="m" font-size="18" fill="#cfe3ff">02</text>
      <text x="450" y="216" font-size="14" font-weight="700" fill="#4cc9f0" letter-spacing="3">TRANSFORM</text>
      <text x="450" y="243" font-size="17" font-weight="600" fill="#ffffff">BI Specialist</text>
      <text x="450" y="266" font-size="14" fill="#8fb0d6">Beximco Pharmaceuticals</text>
    </g>
    <g class="st" style="animation-delay:.9s">
      <text x="750" y="98" font-size="20" font-weight="700" fill="#ffffff">2025</text>
      <circle cx="750" cy="150" r="32" fill="#13294b" stroke="#2a78d6" stroke-width="3"/>
      <text x="750" y="157" class="m" font-size="18" fill="#cfe3ff">03</text>
      <text x="750" y="216" font-size="14" font-weight="700" fill="#4cc9f0" letter-spacing="3">LOAD</text>
      <text x="750" y="243" font-size="17" font-weight="600" fill="#ffffff">Purchasing Analytics</text>
      <text x="750" y="266" font-size="14" fill="#8fb0d6">FORVIA HELLA, Germany</text>
    </g>
    <g class="st" style="animation-delay:1.3s">
      <text x="1050" y="98" font-size="20" font-weight="700" fill="#ffffff">2027</text>
      <circle class="ring" cx="1050" cy="150" r="32" fill="none" stroke="#f4a261" stroke-width="2"/>
      <circle cx="1050" cy="150" r="32" fill="#13294b" stroke="#f4a261" stroke-width="3"/>
      <text x="1050" y="157" class="m" font-size="18" fill="#ffe2c7">04</text>
      <text x="1050" y="216" font-size="14" font-weight="700" fill="#f4a261" letter-spacing="3">SERVE</text>
      <text x="1050" y="243" font-size="17" font-weight="600" fill="#ffffff">M.A. Information Systems</text>
      <text x="1050" y="266" font-size="14" fill="#8fb0d6">Fachhochschule Südwestfalen</text>
    </g>
  </g>
</svg>
